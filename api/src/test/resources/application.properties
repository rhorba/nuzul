# Integration tests drive hold expiry themselves (HoldExpiryIT): a background run would race tests that age holds
# on purpose (e.g. ConfirmIT's expired-hold 410). Tests that need the scheduler turn it back on.
app.expiry.enabled=false
# Same for the outbox relay (story 3.1): OutboxRelayIT drives it; a background run would publish rows other tests assert
# on as unpublished.
app.outbox.enabled=false
# The notification listener (story 3.1) reads reservation-events from earliest: in other ITs it would dead-letter the
# placeholder payloads they publish. IdempotentConsumerIT turns it back on.
app.notification.listener.enabled=false
# The search indexer (story 3.2) reads catalog-events from earliest and writes to the JVM-wide Elasticsearch: in other
# ITs it would rewrite documents they assert on. SearchIndexerIT starts its container for the duration of the class.
app.search.listener.enabled=false
