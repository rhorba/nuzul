# Integration tests drive hold expiry themselves (HoldExpiryIT): a background run would race tests that age holds
# on purpose (e.g. ConfirmIT's expired-hold 410). Tests that need the scheduler turn it back on.
app.expiry.enabled=false
# Same for the outbox relay (story 3.1): OutboxRelayIT drives it; a background run would publish rows other tests assert
# on as unpublished.
app.outbox.enabled=false
