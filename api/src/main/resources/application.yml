spring:
  application:
    name: nuzul-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/nuzul}
    username: ${DB_USER:nuzul}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      # Idempotency response cache only (never authoritative): short timeouts so a Redis outage costs a hold
      # ~0.5 s at most before it falls back to the Postgres unique constraint.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 300ms
      connect-timeout: 300ms
  kafka:
    # Story 3.1: the outbox relay is the only producer; consumers dedupe on processed_event (at-least-once).
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      group-id: ${KAFKA_GROUP_ID:nuzul-api}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit each record's offset once it is handled (or dead-lettered), so a retry or DLT decision applies to that
      # record alone and a restart never replays records that already succeeded behind a failed one.
      ack-mode: record
  elasticsearch:
    # Story 3.2: hotel search projection (never authoritative). Short timeouts: an ES outage must cost a search request
    # or an indexer retry a few seconds at most, never block bookings.
    uris: ${ES_URL:http://localhost:9200}
    username: ${ES_USER:}
    password: ${ES_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 5s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/nuzul}
          audiences: ${OIDC_AUDIENCE:nuzul-api}

management:
  health:
    redis:
      # Redis is a fail-open cache (idempotency replays): the API works without it, so it must not turn health DOWN.
      enabled: false
    elasticsearch:
      # Elasticsearch is a rebuildable search projection, never authoritative: bookings work without it, so it must not
      # turn health DOWN (story 3.2).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

app:
  hold-minutes: ${APP_HOLD_MINUTES:10}
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:4200}
  time-zone: ${APP_TIME_ZONE:Africa/Casablanca}
  expiry:
    # Story 2.4: HELD reservations past hold_expires_at become EXPIRED and give their rooms back. One replica at a
    # time (ShedLock); each run expires at most batch-size holds, one short transaction each.
    enabled: ${APP_EXPIRY_ENABLED:true}
    interval: ${APP_EXPIRY_INTERVAL:PT30S}
    batch-size: ${APP_EXPIRY_BATCH_SIZE:500}
  outbox:
    # Story 3.1 (ADR-4): one replica at a time (ShedLock) publishes unpublished outbox rows to Kafka, oldest first.
    # A row that fails max-attempts times is parked (outbox.failed gauge) so it never blocks the rows behind it.
    enabled: ${APP_OUTBOX_ENABLED:true}
    interval: ${APP_OUTBOX_INTERVAL:PT1S}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:100}
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:10}
    # A run stops starting sends after this long, so a slow broker cannot keep it past its 1-minute ShedLock lock
    # (budget + the 15 s send timeout must stay under it; checked at startup).
    run-budget: ${APP_OUTBOX_RUN_BUDGET:PT30S}
    retention: ${APP_OUTBOX_RETENTION:P7D}
    # Nightly delete of rows published more than retention ago (Spring cron: sec min hour day month weekday).
    retention-cron: ${APP_OUTBOX_RETENTION_CRON:0 30 3 * * *}
  search:
    # Story 3.2: searches and live writes go through this alias; reindex builds <alias>-<timestamp> and swaps it in.
    alias: ${APP_SEARCH_ALIAS:hotels}
    # Create the index and alias at startup when missing. An unreachable cluster only logs a WARN.
    bootstrap-enabled: ${APP_SEARCH_BOOTSTRAP_ENABLED:true}
  kafka:
    # Story 3.1: reservation-events and catalog-events are created at startup with these settings. Partitions cap
    # consumer parallelism (an aggregate's events stay on one partition); replicas must not exceed the broker count.
    partitions: ${APP_KAFKA_PARTITIONS:3}
    replicas: ${APP_KAFKA_REPLICAS:1}
  rate-limit:
    # Story 2.5: per-guest token bucket on POST /api/v1/reservations (capacity requests per period, refilled in one go
    # at the end of each period; Redis, fail-open), and a cap on unpaid holds per guest.
    reservation-post:
      capacity: ${APP_RATE_LIMIT_RESERVATION_POST_CAPACITY:30}
      period: ${APP_RATE_LIMIT_RESERVATION_POST_PERIOD:PT1M}
    max-active-holds: ${APP_RATE_LIMIT_MAX_ACTIVE_HOLDS:5}
  seed:
    # Demo data (story 1.5). Off by default; the owner is the realm-pinned admin@nuzul.local user id.
    enabled: ${APP_SEED_ENABLED:false}
    owner-sub: ${APP_SEED_OWNER_SUB:5f0c3a1e-7b2d-4c8e-9a41-2d6e8b7a1f35}
