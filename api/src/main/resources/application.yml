spring:
  application:
    name: nuzul-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/nuzul}
    username: ${DB_USER:nuzul}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      # Idempotency response cache only (never authoritative): short timeouts so a Redis outage costs a hold
      # ~0.5 s at most before it falls back to the Postgres unique constraint.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 300ms
      connect-timeout: 300ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/nuzul}
          audiences: ${OIDC_AUDIENCE:nuzul-api}

management:
  health:
    redis:
      # Redis is a fail-open cache (idempotency replays): the API works without it, so it must not turn health DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  endpoint:
    health:
      probes:
        enabled: true

app:
  hold-minutes: ${APP_HOLD_MINUTES:10}
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:4200}
  time-zone: ${APP_TIME_ZONE:Africa/Casablanca}
  expiry:
    # Story 2.4: HELD reservations past hold_expires_at become EXPIRED and give their rooms back. One replica at a
    # time (ShedLock); each run expires at most batch-size holds, one short transaction each.
    enabled: ${APP_EXPIRY_ENABLED:true}
    interval: ${APP_EXPIRY_INTERVAL:PT30S}
    batch-size: ${APP_EXPIRY_BATCH_SIZE:500}
  rate-limit:
    # Story 2.5: per-guest token bucket on POST /api/v1/reservations (capacity requests per period, refilled in one go
    # at the end of each period; Redis, fail-open), and a cap on unpaid holds per guest.
    reservation-post:
      capacity: ${APP_RATE_LIMIT_RESERVATION_POST_CAPACITY:30}
      period: ${APP_RATE_LIMIT_RESERVATION_POST_PERIOD:PT1M}
    max-active-holds: ${APP_RATE_LIMIT_MAX_ACTIVE_HOLDS:5}
  seed:
    # Demo data (story 1.5). Off by default; the owner is the realm-pinned admin@nuzul.local user id.
    enabled: ${APP_SEED_ENABLED:false}
    owner-sub: ${APP_SEED_OWNER_SUB:5f0c3a1e-7b2d-4c8e-9a41-2d6e8b7a1f35}
