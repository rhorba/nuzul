name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — verify + SonarCloud
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs history for new-code detection
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test, coverage gate (unit + Testcontainers + JaCoCo ≥ 80 %)
        run: ./mvnw -B -ntp verify
      - name: SonarCloud scan + quality gate
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.9.0.7382:sonar
          -Dsonar.qualitygate.wait=true
      - name: SonarCloud skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN not set — SonarCloud scan skipped."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api-reports
          path: |
            api/target/site/jacoco/
            api/target/surefire-reports/
            api/target/failsafe-reports/
          retention-days: 7

  web:
    name: web — lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx ng test --watch=false
      - run: npm run build

  images:
    name: images — build + Trivy (+ push on main)
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/nuzul-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/nuzul-web
      PG_IMAGE: ghcr.io/${{ github.repository_owner }}/nuzul-postgres
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: api image (Jib, amd64 tarball for scanning)
        working-directory: api
        run: ./mvnw -B -ntp -DskipTests package jib:buildTar -Djib.from.platforms=linux/amd64 -Djib.outputPaths.tar=target/jib-image.tar
      - name: Trivy — api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: api/target/jib-image.tar
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: web image (amd64, loaded for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64
          load: true
          tags: nuzul-web:scan
      - name: Trivy — web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nuzul-web:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: postgres image (amd64, loaded for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64
          load: true
          tags: nuzul-postgres:scan
      - name: Trivy — postgres image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nuzul-postgres:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push api (amd64 + arm64)
        if: env.PUSH == 'true'
        working-directory: api
        run: >
          ./mvnw -B -ntp -DskipTests jib:build
          -Djib.to.image=$API_IMAGE -Djib.to.tags=${{ github.sha }},latest
          -Djib.to.auth.username=${{ github.actor }} -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
      - name: Push web (amd64 + arm64)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
      - name: Push postgres (amd64 + arm64)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.PG_IMAGE }}:${{ github.sha }}
            ${{ env.PG_IMAGE }}:latest
